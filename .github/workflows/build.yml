name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            msvc: amd64_x86
          - arch: x64
            msvc: amd64
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc }}

      - name: Configure
        run: cmake -S . -B build -G "NMake Makefiles" -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/bin/${{ matrix.arch }}"

      - name: Build
        run: cmake --build build --target install

      - uses: actions/upload-artifact@v4
        with:
          name: PaneFilter-${{ matrix.arch }}
          path: bin/${{ matrix.arch }}
