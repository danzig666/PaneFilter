name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            msvc: amd64_x86
          - arch: x64
            msvc: amd64
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc }}

      - name: Configure
        run: cmake -S . -B build -G "NMake Makefiles" -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/bin/${{ matrix.arch }}"

      - name: Build
        run: cmake --build build --target install

      - uses: actions/upload-artifact@v4
        with:
          name: PaneFilter-${{ matrix.arch }}
          path: bin/${{ matrix.arch }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package
        run: |
          for arch in x86 x64; do
            dir="package-$arch/PaneFilter"
            mkdir -p "$dir"
            cp artifacts/PaneFilter-$arch/PaneFilter.dll \
               artifacts/PaneFilter-$arch/PaneFilter_Eng.lng \
               artifacts/PaneFilter-$arch/PaneFilter_Eng.hlf \
               artifacts/PaneFilter-$arch/File_ID.diz \
               "PaneFilter macro.lua" README.md LICENSE "$dir/"
            (cd "package-$arch" && zip -r "../PaneFilter-${GITHUB_REF_NAME}-$arch.zip" PaneFilter)
            (cd artifacts/PaneFilter-$arch && zip "../../PaneFilter-${GITHUB_REF_NAME}-$arch-pdb.zip" PaneFilter.pdb)
          done

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            PaneFilter-${{ github.ref_name }}-x86.zip
            PaneFilter-${{ github.ref_name }}-x64.zip
            PaneFilter-${{ github.ref_name }}-x86-pdb.zip
            PaneFilter-${{ github.ref_name }}-x64-pdb.zip
